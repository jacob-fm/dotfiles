# file: ~/.config/tmux-sessionizer/tmux-sessionizer.conf
# Config for tmux-sessionizer (https://github.com/ThePrimeagen/tmux-sessionizer)

# Where to look for projects. Overrides the upstream default
# (~/ ~/personal ~/personal/dev/env/.config).
TS_SEARCH_PATHS=(~/Documents/Repos)
# A path can carry its own depth suffix. :0 means "this directory itself, no
# subdirectories", which is how ~/dotfiles gets its own session entry.
TS_EXTRA_SEARCH_PATHS=(~/Documents/Repos/learning-rust ~/dotfiles:0)

# One entry per stow package, each at its own depth: stow-session-dirs walks
# past single-child directories (nvim -> nvim/.config/nvim) and stops where the
# config actually lives (tmux stays at tmux), and :0 adds each result verbatim.
if [[ -x $HOME/.local/bin/stow-session-dirs ]]; then
    while IFS= read -r ts_dir; do
        TS_EXTRA_SEARCH_PATHS+=("$ts_dir:0")
    done < <("$HOME/.local/bin/stow-session-dirs" "$HOME/dotfiles")
fi

# Depth of the directory search below each search path (default 1).
# TS_MAX_DEPTH=1

# Commands runnable via `tmux-sessionizer -s <idx>` (windows at index 69+,
# or splits with --vsplit/--hsplit).
# TS_SESSION_COMMANDS=(lazygit btop)

# Logging: "echo" to stdout, "file" to TS_LOG_FILE
# TS_LOG=file
# TS_LOG_FILE=~/.local/share/tmux-sessionizer/tmux-sessionizer.logs
