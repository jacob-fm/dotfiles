# simplify
set -g status-right "%H:%M"

# transparent background
set-option -g status-style bg=default
set -g window-status-current-style fg=colour14

# show directory of pane
set -g status-left "#{pane_current_path} "
# give more space to show path
set -g status-left-length 85

# fixes terminal scrolling
set -g mouse on

# vi copy-mode: prefix+[ to enter, then vim motions; v selects, y yanks to macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi Escape send -X cancel

# deeper scrollback (default is 2000 lines)
set -g history-limit 50000

# true color so Everforest / p10k render correctly inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# let inline-image escape sequences through (fzf imgcat preview)
set -g allow-passthrough on

# quality of life with vim workflows
set -s escape-time 0
set -g focus-events on

# Ghostty tab titles: let tmux own the terminal title so each tab shows the
# session name. Without this tmux never emits OSC 2, so the tab keeps whatever
# oh-my-zsh's preexec last set -- i.e. "tmux-sessionizer" forever.
set -g set-titles on
set -g set-titles-string "#S"

# prefix+f: sessionizer popup (works even when a full-screen app has the shell)
bind f display-popup -E ~/.local/bin/tmux-sessionizer

# Ghostty sends cmd+ctrl+d / cmd+ctrl+shift+d as these private sequences (see
# ghostty config.ghostty); split like Ghostty would, keeping the cwd
set -s user-keys[100] "\e[300~"
set -s user-keys[101] "\e[301~"
bind -n User100 split-window -h -c "#{pane_current_path}"
bind -n User101 split-window -v -c "#{pane_current_path}"

# cmd+ctrl+hjkl: navigate panes with vim motions, no prefix
set -s user-keys[111] "\e[311~"
set -s user-keys[112] "\e[312~"
set -s user-keys[113] "\e[313~"
set -s user-keys[114] "\e[314~"
bind -n User111 select-pane -L
bind -n User112 select-pane -D
bind -n User113 select-pane -U
bind -n User114 select-pane -R

# cmd+ctrl+w: close the current pane, confirming first (like prefix+x)
set -s user-keys[115] "\e[315~"
# this version makes you confirm before closing
# bind -n User115 confirm-before -p "kill pane #P? (y/n)" kill-pane
# this version doesn't
bind -n User115  kill-pane
